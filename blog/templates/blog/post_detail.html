<!DOCTYPE html>
<html>
<head><title>{{ post.title }}</title></head>
<body>
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
    <p>By {{ post.author.username }} at {{ post.created_at }}</p>

    {% if user == post.author %}
        <a href="{% url 'post_edit' post.pk %}">Edit</a>
        <a href="{% url 'post_delete' post.pk %}">Delete</a>
    {% endif %}
    <a href="{% url 'post_list' %}">Back</a>
</body>
</html>
